<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGO - 4490</title>
</head>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      color: #111111;
    }

    .container {
      width: 100%;
      padding: 32px 20px;
      text-align: center;
    }

    h1 {
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(30px, 5vw, 54px);
      font-weight: 600;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }

    .location {
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(17px, 2.2vw, 24px);
      font-weight: 300;
      margin-bottom: 28px;
    }

    .notice {
      display: inline-block;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.4px;
      text-decoration: underline;
      text-underline-offset: 5px;
    }
  </style>
<body>
  <main class="container">
    <h1>Software Gestão de Operações</h1>
    <div class="location">Póvoa de Varzim</div>
    <div class="notice">Software Interno NÃO OFICIAL</div>
  </main>
</body>
</html>
