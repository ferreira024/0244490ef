<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#25292b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<title>SGO - PVZ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--deep:#25292b;--red:#bf4343;--amber:#cf942d;--blue:#3979a5;--green:#3f8065;--violet:#775c92}
*{box-sizing:border-box}html,body,#app{height:100%;margin:0;font-family:Arial,sans-serif}.app{height:100%;display:grid;grid-template-rows:62px 1fr;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:8px max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));background:#25292b;color:#fff;z-index:1100}
.brand{display:flex;align-items:center;gap:10px}.mark{width:40px;height:40px;border-radius:12px;background:conic-gradient(from 45deg,var(--red) 0 25%,var(--amber) 0 50%,var(--green) 0 75%,var(--blue) 0);box-shadow:inset 0 0 0 6px #fffd}
.brand b{font-weight:400}.search{flex:1;max-width:620px;display:flex}.search input{width:100%;border:0;border-radius:10px 0 0 10px;padding:11px;background:#ffffff18;color:#fff;outline:1px solid #ffffff25}.search button,.top button{border:0;border-radius:10px;background:#ffffff18;color:#fff;padding:10px 12px}.search button{border-radius:0 10px 10px 0}
.work{display:grid;grid-template-columns:320px 1fr;min-height:0}.side{overflow:auto;background:#e9edef;padding:12px;z-index:1000}.status{padding:9px;border-radius:10px;background:#fff9;margin-bottom:10px;font-size:12px}
.group{background:#fff;border-radius:13px;overflow:hidden;margin-bottom:10px}.head{padding:12px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#687074}
.layer{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid #eee;cursor:pointer}.layer input{width:18px;height:18px}.dot{width:10px;height:10px;border-radius:50%}.txt{font-size:14px}.txt small{display:block;color:#777;margin-top:2px}
.mapwrap{position:relative;min-width:0;min-height:0}#map{height:100%;width:100%}.loading{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:900;background:#25292bee;color:#fff;padding:9px 12px;border-radius:10px;font-size:12px}.hide{display:none}
.coords{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:800;background:#25292bdd;color:#fff;padding:6px 9px;border-radius:8px;font-size:11px}
.leaflet-popup-content{min-width:240px}.pt{font-weight:700;margin-bottom:7px}.pm{font-size:12px;line-height:1.5;color:#4d5558}.pm b{color:#222}
@media(max-width:820px){.work{grid-template-columns:1fr}.side{position:absolute;top:62px;bottom:0;left:-330px;width:min(310px,88vw);transition:.2s;box-shadow:8px 0 30px #0003}.side.open{left:0}.brand b{display:none}.top{gap:6px}.top button{padding:10px}.leaflet-control-zoom{margin-top:64px!important}}
</style>
</head>
<body><div class="app">
<header class="top"><div class="brand"><div class="mark"></div><b>SGO - PVZ</b></div>
<form class="search" id="search"><input id="q" placeholder="Pesquisar local…"><button>⌕</button></form>
<button id="layersBtn">☰ Camadas</button></header>
<div class="work"><aside class="side" id="side">
<div class="status" id="status">● Online · ocorrências atualizadas a cada 1 segundo</div>

<div class="group"><div class="head">Ocorrências</div>
<label class="layer"><input type="checkbox" data-layer="occ" checked><span class="dot" style="background:#d62828"></span><span class="txt">Ocorrências ANEPC<small>Portugal Continental · atualização 1 s</small></span></label></div>

<div class="group"><div class="head">Zonas de risco</div>
<label class="layer"><input type="checkbox" data-layer="fire"><span class="dot" style="background:#bd3b3b"></span><span class="txt">Perigosidade de incêndio<small>PDM</small></span></label>
<label class="layer"><input type="checkbox" data-layer="pmdfci"><span class="dot" style="background:#e47d2c"></span><span class="txt">Perigosidade florestal<small>PMDFCI</small></span></label>
<label class="layer"><input type="checkbox" data-layer="flood"><span class="dot" style="background:#367daf"></span><span class="txt">Zonas de cheia<small>PDM</small></span></label></div>

<div class="group"><div class="head">Rede de socorro</div>
<label class="layer"><input type="checkbox" data-layer="hydrants"><span class="dot" style="background:#c53838"></span><span class="txt">Marcos / hidrantes<small>Vetorial e clicável</small></span></label>
<label class="layer"><input type="checkbox" data-layer="reservoirs"><span class="dot" style="background:#2e8fab"></span><span class="txt">Reservatórios de água<small>Detalhes ao clicar</small></span></label></div>

<div class="group"><div class="head">Infraestruturas</div>
<label class="layer"><input type="checkbox" data-layer="gas"><span class="dot" style="background:#d6a22f"></span><span class="txt">Rede de gás<small>Detalhes ao clicar</small></span></label>
<label class="layer"><input type="checkbox" data-layer="water"><span class="dot" style="background:#418fc1"></span><span class="txt">Rede de águas<small>Detalhes ao clicar</small></span></label></div>

<div class="group"><div class="head">Edifícios e população vulnerável</div>
<label class="layer"><input type="checkbox" data-layer="homes"><span class="dot" style="background:#775c92"></span><span class="txt">Lares e residências<small>Equipamentos coletivos</small></span></label>
<label class="layer"><input type="checkbox" data-layer="health"><span class="dot" style="background:#3d8b64"></span><span class="txt">Saúde<small>Hospital, centros e clínicas</small></span></label>
<label class="layer"><input type="checkbox" data-layer="municipal"><span class="dot" style="background:#4b5660"></span><span class="txt">Administração pública<small>Equipamentos municipais</small></span></label></div>

<div class="group"><div class="head">Ordenamento</div>
<label class="layer"><input type="checkbox" data-layer="protection"><span class="dot" style="background:#678455"></span><span class="txt">Proteção e salvaguarda<small>Regimes especiais</small></span></label></div>
</aside>
<main class="mapwrap"><div id="map"></div><div id="loading" class="loading hide">A carregar…</div><div id="coords" class="coords">41.38300, -8.76300</div></main>
</div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/esri-leaflet@3.0.15/dist/esri-leaflet.js"></script>
<script>
const PVZ=[41.383,-8.763], map=L.map('map',{minZoom:6,maxZoom:20}).setView(PVZ,13);
const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap'}).addTo(map);
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Esri'});
L.control.layers({'Mapa':osm,'Satélite':sat}).addTo(map);
const NEW='https://sig.cm-pvarzim.pt/server/rest/services/Servicos/';
const OLD='https://sigonline.cm-pvarzim.pt/arcgis/rest/services/';
const ANEPC='https://services-eu1.arcgis.com/VlrHb7fn5ewYhX6y/ArcGIS/rest/services/OcorrenciasSite/FeatureServer/0';
const clean=v=>{const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML};
const details=p=>Object.entries(p||{}).filter(([k,v])=>v!==null&&v!==''&&!/^OBJECTID$|^Shape/i.test(k)).slice(0,18).map(([k,v])=>'<div><b>'+clean(k.replaceAll('_',' '))+':</b> '+clean(v)+'</div>').join('');
const genericPopup=(title,p)=>'<div class="pt">'+clean(title)+'</div><div class="pm">'+details(p)+'</div>';

function dyn(url,ids,opacity=.7){const x=L.esri.dynamicMapLayer({url,layers:ids,opacity,useCors:false});x._identify={url,ids};return x}
function vector(url,color,radius=7){
 return L.esri.featureLayer({url,useCors:false,pointToLayer:(g,ll)=>L.circleMarker(ll,{radius,fillColor:color,color:'#fff',weight:2,fillOpacity:.95})})
 .bindPopup(l=>genericPopup(l.feature.properties.DESIGNACAO||l.feature.properties.IDENTIF||l.feature.properties.REFER||'Informação',l.feature.properties));
}
const equip=OLD+'Internet/ACTIV_ECONOMICAS_Empresas/MapServer/74';
const equipment=(where,color)=>L.esri.featureLayer({url:equip,where,useCors:false,pointToLayer:(g,ll)=>L.circleMarker(ll,{radius:7,fillColor:color,color:'#fff',weight:2,fillOpacity:.95})})
.bindPopup(l=>genericPopup(l.feature.properties.IDENTIF||l.feature.properties.REFER||'Equipamento',l.feature.properties));

const occ=L.esri.featureLayer({url:ANEPC,where:'1=1',useCors:true,pointToLayer:(g,ll)=>{
 const p=g.properties||{}, state=(p.EstadoAgrupado||p.EstadoOcorrencia||'').toLowerCase();
 const color=state.includes('resolu')?'#f59e0b':state.includes('concl')?'#64748b':'#d62828';
 return L.circleMarker(ll,{radius:8,fillColor:color,color:'#fff',weight:2,fillOpacity:.95});
}}).bindPopup(l=>{
 const p=l.feature.properties||{};
 return '<div class="pt">Ocorrência '+clean(p.Numero||'ANEPC')+'</div><div class="pm">'+
 '<div><b>Natureza:</b> '+clean(p.Natureza||'—')+'</div><div><b>Estado:</b> '+clean(p.EstadoOcorrencia||p.EstadoAgrupado||'—')+'</div>'+
 '<div><b>Início:</b> '+clean(p.DataInicioOcorrencia||((p.Data||'')+' '+(p.Hora||'')))+'</div>'+
 '<div><b>Local:</b> '+clean([p.Endereco,p.Localidade,p.Freguesia,p.Concelho].filter(Boolean).join(' · ')||'—')+'</div>'+
 '<div><b>Operacionais:</b> '+clean(p.Operacionais??'—')+' · <b>Meios terrestres:</b> '+clean(p.MeiosTerrestres??'—')+'</div>'+
 '<div><b>Meios aéreos:</b> '+clean(p.MeiosAereos??'—')+' · <b>Entidades:</b> '+clean(p.QuantEntidades??'—')+'</div></div>';
});
const layers={
 occ,
 fire:dyn(NEW+'PLANOS_PDM2015/MapServer',[121],.60),
 pmdfci:dyn(NEW+'PLANOS_PMDFCI/MapServer',[10],.58),
 flood:dyn(NEW+'PLANOS_PDM2015/MapServer',[113],.62),
 protection:dyn(NEW+'PLANOS_PDM2015/MapServer',[104,105],.55),
 hydrants:vector(OLD+'Inter_Intra/TEMATICOS_Infraestruturas/MapServer/87','#c53838',7),
 reservoirs:vector(OLD+'Inter_Intra/TEMATICOS_Infraestruturas/MapServer/4','#2e8fab',7),
 gas:dyn(OLD+'Inter_Intra/TEMATICOS_Infraestruturas/MapServer',[89],.78),
 water:dyn(OLD+'Inter_Intra/TEMATICOS_Infraestruturas/MapServer',[91],.72),
 homes:equipment("SUB_TEMA='Lares' OR SUB_TEMA='Centro Social - Estrutura Residencial para Idosos'",'#775c92'),
 health:equipment("TEMA='Saúde'",'#3f8065'),
 municipal:equipment("TEMA='Administração Pública'",'#4b5660')
};
occ.addTo(map);

document.querySelectorAll('[data-layer]').forEach(i=>i.onchange=()=>{
 const l=layers[i.dataset.layer]; if(!l)return;
 i.checked?l.addTo(map):map.removeLayer(l);
 if(innerWidth<821)document.querySelector('#side').classList.remove('open');
});
document.querySelector('#layersBtn').onclick=()=>document.querySelector('#side').classList.toggle('open');
map.on('mousemove',e=>document.querySelector('#coords').textContent=e.latlng.lat.toFixed(5)+', '+e.latlng.lng.toFixed(5));

/* Identificação das camadas raster/dinâmicas: clicar no mapa consulta os atributos do SIG. */
map.on('click',e=>{
 const active=Object.entries(layers).filter(([k,l])=>l._identify&&map.hasLayer(l));
 if(!active.length)return;
 active.forEach(([name,l])=>{
   L.esri.identifyFeatures({url:l._identify.url}).on(map).at(e.latlng).layers('visible:'+l._identify.ids.join(',')).run((err,fc)=>{
     if(err||!fc||!fc.features||!fc.features.length)return;
     const f=fc.features[0], p=f.properties||{};
     L.popup().setLatLng(e.latlng).setContent(genericPopup(p.NOME||p.DESIGNACAO||p.DESCRICAO||'Detalhes da camada',p)).openOn(map);
   });
 });
});

/* Atualização pedida: consulta a camada oficial ANEPC de segundo a segundo. */
let lastTick=0;
setInterval(()=>{
 if(!navigator.onLine||!map.hasLayer(occ))return;
 try{occ.refresh();lastTick=Date.now();document.querySelector('#status').textContent='● Online · ANEPC atualizado '+new Date().toLocaleTimeString('pt-PT');}catch(e){}
},1000);

window.addEventListener('online',()=>document.querySelector('#status').textContent='● Online · ocorrências atualizadas a cada 1 segundo');
window.addEventListener('offline',()=>document.querySelector('#status').textContent='● Offline · a mostrar últimos dados disponíveis');

document.querySelector('#search').onsubmit=async e=>{
 e.preventDefault();const q=document.querySelector('#q').value.trim();if(!q)return;
 const box=document.querySelector('#loading');box.classList.remove('hide');box.textContent='A pesquisar…';
 try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=pt&q='+encodeURIComponent(q+' Portugal'));const d=await r.json();
 if(d[0])map.setView([+d[0].lat,+d[0].lon],17);}finally{box.classList.add('hide')}
};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
